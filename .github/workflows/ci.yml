name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: generated data is committed and consistent
        run: |
          test -f packages/shared/src/map/data.ts || (echo "::error::map data missing" && exit 1)
          git diff --exit-code -- packages/shared/src/map/data.ts data/ \
            || (echo "::error::generated map data changed during build — run 'npm run data'" && exit 1)
